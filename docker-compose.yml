services:
  db:
    image: postgres:15-alpine
    container_name: postgres_gateway
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: redis_gateway
    restart: always
    # Configuramos Redis para que use la base de datos definida en el .env
    command: redis-server --appendonly yes --databases 16
    environment:
      REDIS_PORT: ${REDIS_PORT}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
  
  auth:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth_service
    volumes:
      - ./shared-keys/shared-keys-private:/shared-keys/shared-keys-private:ro
      - ./shared-keys/shared-keys-public:/shared-keys/shared-keys-public:ro
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PRIVATE_KEY: ${PRIVATE_KEY}
      PUBLIC_KEY: ${PUBLIC_KEY}
      ALGORITHM: ${ALGORITHM}
      ECUADOR_TZ: ${ECUADOR_TZ}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_DB: ${REDIS_DB}
      PORT: ${PORT_AUTH}
    ports:  
      - "${PORT_AUTH}:${PORT_AUTH}"
    depends_on:
      - db  
      - redis

  sale:
    build: 
      context: ./sale_service
      dockerfile: Dockerfile
    container_name: sale_service
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PUBLIC_KEY: ${PUBLIC_KEY}
      ALGORITHM: ${ALGORITHM}
      ECUADOR_TZ: ${ECUADOR_TZ}
      PORT: ${PORT_SALE}
    volumes:
      - ./shared-keys/shared-keys-public:/shared-keys/shared-keys-public:ro
    ports:
      - "${PORT_SALE}:${PORT_SALE}"
    depends_on:
      - db
      
  
  frontend:
    build: 
      context: ./master-getway
      dockerfile: Dockerfile
    container_name: frontend-service
    ports:
      - "${PORT_FRONTEND}:80"
    environment:
      VITE_API_AUTH_URL: ${VITE_API_AUTH_URL}
      VITE_API_SALE_URL: ${VITE_API_SALE_URL}
      VITE_API_TIMEOUT: ${VITE_API_TIMEOUT}
    restart: always
    depends_on:
      - sale
      - auth


volumes:
  postgres_data:
  redis_data: